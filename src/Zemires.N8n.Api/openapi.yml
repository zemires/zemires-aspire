components:
  schemas:
    audit:
      type: object
      properties:
        Credentials Risk Report:
          type: object
          example:
            risk: credentials
            sections:
              - title: Credentials not used in any workflow
                description: These credentials are not used in any workflow. Keeping unused credentials in your instance is an unneeded security risk.
                recommendation: Consider deleting these credentials if you no longer need them.
                location:
                  - kind: credential
                    id: '1'
                    name: My Test Account
        Database Risk Report:
          type: object
          example:
            risk: database
            sections:
              - title: Expressions in "Execute Query" fields in SQL nodes
                description: This SQL node has an expression in the "Query" field of an "Execute Query" operation. Building a SQL query with an expression may lead to a SQL injection attack.
                recommendation: Consider using the "Query Parameters" field to pass parameters to the query
                or validating the input of the expression in the "Query" field.: null
                location:
                  - kind: node
                    workflowId: '1'
                    workflowName: My Workflow
                    nodeId: 51eb5852-ce0b-4806-b4ff-e41322a4041a
                    nodeName: MySQL
                    nodeType: n8n-nodes-base.mySql
        Filesystem Risk Report:
          type: object
          example:
            risk: filesystem
            sections:
              - title: Nodes that interact with the filesystem
                description: This node reads from and writes to any accessible file in the host filesystem. Sensitive file content may be manipulated through a node operation.
                recommendation: Consider protecting any sensitive files in the host filesystem
                or refactoring the workflow so that it does not require host filesystem interaction.: null
                location:
                  - kind: node
                    workflowId: '1'
                    workflowName: My Workflow
                    nodeId: 51eb5852-ce0b-4806-b4ff-e41322a4041a
                    nodeName: Ready Binary file
                    nodeType: n8n-nodes-base.readBinaryFile
        Nodes Risk Report:
          type: object
          example:
            risk: nodes
            sections:
              - title: Community nodes
                description: This node is sourced from the community. Community nodes are not vetted by the n8n team and have full access to the host system.
                recommendation: Consider reviewing the source code in any community nodes installed in this n8n instance
                and uninstalling any community nodes no longer used.: null
                location:
                  - kind: community
                    nodeType: n8n-nodes-test.test
                    packageUrl: https://www.npmjs.com/package/n8n-nodes-test
        Instance Risk Report:
          type: object
          example:
            risk: execution
            sections:
              - title: Unprotected webhooks in instance
                description: These webhook nodes have the "Authentication" field set to "None" and are not directly connected to a node to validate the payload. Every unprotected webhook allows your workflow to be called by any third party who knows the webhook URL.
                recommendation: Consider setting the "Authentication" field to an option other than "None"
                or validating the payload with one of the following nodes.: null
                location:
                  - kind: community
                    nodeType: n8n-nodes-test.test
                    packageUrl: https://www.npmjs.com/package/n8n-nodes-test
    ldap-configuration:
      type: object
      additionalProperties: false
      description: |
        Full LDAP configuration. Every field is returned by GET; send the full object back as PUT body.
      required:
        - loginEnabled
        - loginLabel
        - connectionUrl
        - allowUnauthorizedCerts
        - connectionSecurity
        - connectionPort
        - baseDn
        - bindingAdminDn
        - bindingAdminPassword
        - firstNameAttribute
        - lastNameAttribute
        - emailAttribute
        - loginIdAttribute
        - ldapIdAttribute
        - userFilter
        - synchronizationEnabled
        - synchronizationInterval
        - searchPageSize
        - searchTimeout
        - enforceEmailUniqueness
      properties:
        loginEnabled:
          type: boolean
          description: Whether LDAP login is enabled.
          example: false
        loginLabel:
          type: string
          description: Label shown on the LDAP login button.
          example: LDAP
        connectionUrl:
          type: string
          description: LDAP server URL.
          example: ldap://ldap.example.com
        allowUnauthorizedCerts:
          type: boolean
          description: Whether to allow unauthorized (self-signed) certificates.
          example: false
        connectionSecurity:
          type: string
          enum:
            - none
            - tls
            - startTls
          description: TLS/SSL security mode for the LDAP connection.
          example: none
        connectionPort:
          type: integer
          description: LDAP server port.
          example: 389
        baseDn:
          type: string
          description: Base DN for LDAP search queries.
          example: dc=example,dc=com
        bindingAdminDn:
          type: string
          description: DN of the LDAP admin user for binding.
          example: cn=admin,dc=example,dc=com
        bindingAdminPassword:
          type: string
          description: |
            Password for the LDAP admin user. Redacted on GET; returns the blanking placeholder when a password is stored, empty string when unset. Send the blanking placeholder from a prior GET to keep the stored password unchanged.
        firstNameAttribute:
          type: string
          description: LDAP attribute mapped to the user's first name.
          example: givenName
        lastNameAttribute:
          type: string
          description: LDAP attribute mapped to the user's last name.
          example: sn
        emailAttribute:
          type: string
          description: LDAP attribute mapped to the user's email.
          example: mail
        loginIdAttribute:
          type: string
          description: LDAP attribute used for login (usually the same as emailAttribute).
          example: mail
        ldapIdAttribute:
          type: string
          description: LDAP attribute that uniquely identifies a user.
          example: uid
        userFilter:
          type: string
          description: |
            Additional LDAP filter to apply when searching for users. Use an empty string for no additional filter.
          example: (objectClass=inetOrgPerson)
        synchronizationEnabled:
          type: boolean
          description: Whether automatic LDAP synchronization is enabled.
          example: false
        synchronizationInterval:
          type: integer
          description: Interval in minutes between automatic synchronizations. Ignored if synchronizationEnabled is false.
          example: 60
        searchPageSize:
          type: integer
          description: Number of LDAP entries to fetch per search page.
          example: 1000
        searchTimeout:
          type: integer
          description: LDAP search timeout in seconds.
          example: 60
        enforceEmailUniqueness:
          type: boolean
          description: |
            Whether to enforce that email addresses are unique across LDAP users. When true, if two users have the same email, only the first will be imported.
          example: true
    ldap-configuration.update:
      type: object
      additionalProperties: false
      description: Full LDAP configuration. Use empty strings for unset fields.
      required:
        - loginEnabled
        - loginLabel
        - connectionUrl
        - allowUnauthorizedCerts
        - connectionSecurity
        - connectionPort
        - baseDn
        - bindingAdminDn
        - bindingAdminPassword
        - firstNameAttribute
        - lastNameAttribute
        - emailAttribute
        - loginIdAttribute
        - ldapIdAttribute
        - userFilter
        - synchronizationEnabled
        - synchronizationInterval
        - searchPageSize
        - searchTimeout
        - enforceEmailUniqueness
      properties:
        loginEnabled:
          type: boolean
          description: |
            Whether LDAP login is enabled. Setting this to false is destructive — it deletes all stored LDAP user identities and disables synchronization.
          example: false
        loginLabel:
          type: string
          description: Label shown on the LDAP login button.
          example: LDAP
        connectionUrl:
          type: string
          description: LDAP server URL.
          example: ldap://ldap.example.com
        allowUnauthorizedCerts:
          type: boolean
          description: Whether to allow unauthorized (self-signed) certificates.
          example: false
        connectionSecurity:
          type: string
          enum:
            - none
            - tls
            - startTls
          description: TLS/SSL security mode for the LDAP connection.
          example: none
        connectionPort:
          type: integer
          description: LDAP server port.
          example: 389
        baseDn:
          type: string
          description: Base DN for LDAP search queries.
          example: dc=example,dc=com
        bindingAdminDn:
          type: string
          description: DN of the LDAP admin user for binding.
          example: cn=admin,dc=example,dc=com
        bindingAdminPassword:
          type: string
          description: |
            Password for the LDAP admin user. To keep an existing password unchanged, submit the blanking placeholder from a prior GET response. Use an empty string to clear the password.
        firstNameAttribute:
          type: string
          description: LDAP attribute mapped to the user's first name.
          example: givenName
        lastNameAttribute:
          type: string
          description: LDAP attribute mapped to the user's last name.
          example: sn
        emailAttribute:
          type: string
          description: LDAP attribute mapped to the user's email.
          example: mail
        loginIdAttribute:
          type: string
          description: LDAP attribute used for login (usually the same as emailAttribute).
          example: mail
        ldapIdAttribute:
          type: string
          description: LDAP attribute that uniquely identifies a user.
          example: uid
        userFilter:
          type: string
          description: |
            Additional LDAP filter to apply when searching for users. Use an empty string for no additional filter.
          example: (objectClass=inetOrgPerson)
        synchronizationEnabled:
          type: boolean
          description: Whether automatic LDAP synchronization is enabled.
          example: false
        synchronizationInterval:
          type: integer
          description: Interval in minutes between automatic synchronizations. Ignored if synchronizationEnabled is false.
          example: 60
        searchPageSize:
          type: integer
          description: Number of LDAP entries to fetch per search page.
          example: 1000
        searchTimeout:
          type: integer
          description: LDAP search timeout in seconds.
          example: 60
        enforceEmailUniqueness:
          type: boolean
          description: |
            Whether to enforce that email addresses are unique across LDAP users. When true, if two users have the same email, only the first will be imported.
          example: true
    ldap-sync-history:
      type: object
      additionalProperties: false
      description: LDAP synchronization history record.
      required:
        - id
        - runMode
        - status
        - startedAt
        - endedAt
        - scanned
        - created
        - updated
        - disabled
        - error
      properties:
        id:
          type: integer
          description: Unique identifier for this sync run.
          example: 1
        runMode:
          type: string
          enum:
            - dry
            - live
          description: Whether the sync was a dry run or applied live.
          example: live
        status:
          type: string
          description: Status of the synchronization (e.g., success, error).
          example: success
        startedAt:
          type: string
          format: date-time
          description: Timestamp when the synchronization started.
          example: 2025-07-21T10:30:00Z
        endedAt:
          type: string
          format: date-time
          description: Timestamp when the synchronization completed.
          example: 2025-07-21T10:35:00Z
        scanned:
          type: integer
          description: Number of LDAP entries scanned during synchronization.
          example: 42
        created:
          type: integer
          description: Number of new users created during synchronization.
          example: 5
        updated:
          type: integer
          description: Number of existing users updated during synchronization.
          example: 3
        disabled:
          type: integer
          description: Number of users disabled during synchronization.
          example: 0
        error:
          type: string
          description: Error message if the synchronization failed. Empty string if successful.
          example: ''
    ldap-sync-history.list:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ldap-sync-history'
        nextCursor:
          type: string
          nullable: true
          description: |
            Paginate through the synchronization history by setting the cursor parameter to the nextCursor attribute returned by the previous request. A null value means there are no more records.
          example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
    ldap-sync.update:
      type: object
      additionalProperties: false
      description: Request body for triggering an LDAP synchronization.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - live
            - dry
          description: |
            Type of synchronization. 'live' applies changes to the database, 'dry' performs a test run without persisting changes.
          example: live
    security-policy:
      type: object
      additionalProperties: false
      required:
        - personalSpacePublishing
        - personalSpaceSharing
        - publishedPersonalWorkflowsCount
        - sharedPersonalWorkflowsCount
        - sharedPersonalCredentialsCount
        - redactionEnforcement
      properties:
        personalSpacePublishing:
          type: boolean
          description: Whether members may publish workflows and agents from their personal space.
          example: true
        personalSpaceSharing:
          type: boolean
          description: Whether members may share workflows and credentials from their personal space.
          example: true
        publishedPersonalWorkflowsCount:
          type: integer
          readOnly: true
          description: Number of currently published personal workflows, shown for awareness before tightening the policy.
          example: 3
        sharedPersonalWorkflowsCount:
          type: integer
          readOnly: true
          description: Number of personal workflows currently shared with other users.
          example: 5
        sharedPersonalCredentialsCount:
          type: integer
          readOnly: true
          description: Number of personal credentials currently shared with other users.
          example: 2
        redactionEnforcement:
          type: object
          additionalProperties: false
          required:
            - floor
          properties:
            floor:
              type: string
              enum:
                - off
                - production
                - all
              description: Minimum execution-data redaction level enforced across the instance.
              example: production
    security-policy.update:
      type: object
      additionalProperties: false
      description: Full security policy. All writable fields must be provided; partial updates are not supported.
      required:
        - personalSpacePublishing
        - personalSpaceSharing
        - redactionEnforcement
      properties:
        personalSpacePublishing:
          type: boolean
          description: Whether members may publish workflows and agents from their personal space.
          example: false
        personalSpaceSharing:
          type: boolean
          description: Whether members may share workflows and credentials from their personal space.
          example: false
        redactionEnforcement:
          type: object
          additionalProperties: false
          required:
            - floor
          properties:
            floor:
              type: string
              enum:
                - off
                - production
                - all
              description: Minimum execution-data redaction level enforced across the instance.
              example: production
        publishedPersonalWorkflowsCount:
          type: integer
          description: |
            Read-only usage count returned by GET. Ignored on write so a GET response can be sent back as a PUT body.
        sharedPersonalWorkflowsCount:
          type: integer
          description: |
            Read-only usage count returned by GET. Ignored on write so a GET response can be sent back as a PUT body.
        sharedPersonalCredentialsCount:
          type: integer
          description: |
            Read-only usage count returned by GET. Ignored on write so a GET response can be sent back as a PUT body.
    otel-settings:
      type: object
      additionalProperties: false
      description: |
        The OpenTelemetry configuration, matching the fields exposed in the UI. On a write this is a full replacement: every field must be provided. Fields managed declaratively via environment variables are returned with their effective value and ignored on write.
      required:
        - enabled
        - exporterEndpoint
        - exporterTracingPath
        - exporterServiceName
        - exporterHeaders
        - tracesSampleRate
        - startupConnectivityTimeoutMs
        - includeNodeSpans
        - injectOutbound
        - productionExecutionsOnly
      properties:
        enabled:
          type: boolean
          description: Whether OpenTelemetry tracing is enabled.
          example: true
        exporterEndpoint:
          type: string
          format: uri
          description: The base URL of the OTLP collector to export traces to.
          example: http://localhost:4318
        exporterTracingPath:
          type: string
          description: The path appended to the endpoint for the OTLP traces signal.
          example: /v1/traces
        exporterServiceName:
          type: string
          minLength: 1
          description: The `service.name` resource attribute reported on every span.
          example: n8n
        exporterHeaders:
          type: string
          description: |
            Additional headers sent to the OTLP collector, as a single string of comma-separated `key=value` pairs (e.g. `authorization=Bearer my-token,x-tenant-id=acme`). Whitespace around each key and value is trimmed; a value may contain spaces but not commas. Use an empty string when unused.
          example: authorization=Bearer my-token,x-tenant-id=acme
        tracesSampleRate:
          type: number
          minimum: 0
          maximum: 1
          description: The ratio of traces to sample, between 0 (none) and 1 (all).
          example: 1
        startupConnectivityTimeoutMs:
          type: integer
          minimum: 0
          description: |
            How long, in milliseconds, to wait when checking the collector is reachable. Also used as the timeout for the test-trace endpoint.
          example: 2000
        includeNodeSpans:
          type: boolean
          description: Whether to emit a span for each node execution in addition to the workflow span.
          example: true
        injectOutbound:
          type: boolean
          description: Whether to inject trace context headers into outbound HTTP requests made by nodes.
          example: true
        productionExecutionsOnly:
          type: boolean
          description: |
            When true, only production executions of published (active) workflows are traced, not manual/test runs.
          example: true
    otel-test-trace:
      type: object
      additionalProperties: false
      description: |
        The connection details to test against an OTLP collector. Fields managed declaratively via environment variables are overridden with their effective value before the test is sent.
      required:
        - exporterEndpoint
        - exporterTracingPath
        - exporterServiceName
        - exporterHeaders
        - startupConnectivityTimeoutMs
      properties:
        exporterEndpoint:
          type: string
          format: uri
          description: The base URL of the OTLP collector to export traces to.
          example: http://localhost:4318
        exporterTracingPath:
          type: string
          description: The path appended to the endpoint for the OTLP traces signal.
          example: /v1/traces
        exporterServiceName:
          type: string
          minLength: 1
          description: The `service.name` resource attribute reported on the test span.
          example: n8n
        exporterHeaders:
          type: string
          description: |
            Additional headers sent to the OTLP collector, as a single string of comma-separated `key=value` pairs (e.g. `authorization=Bearer my-token,x-tenant-id=acme`). Whitespace around each key and value is trimmed; a value may contain spaces but not commas. Use an empty string when unused.
          example: authorization=Bearer my-token,x-tenant-id=acme
        startupConnectivityTimeoutMs:
          type: integer
          minimum: 0
          description: How long, in milliseconds, to wait for the collector to respond.
          example: 2000
    otel-test-trace-result:
      type: object
      additionalProperties: false
      description: The outcome of the test connection to the OTLP collector.
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the test span was accepted by the collector.
          example: true
        error:
          type: string
          description: |
            The error reported by the collector or exporter. Present only when `success` is false.
          example: 'Failed to connect: 401 Unauthorized'
    oidc-configuration:
      type: object
      additionalProperties: false
      required:
        - clientId
        - clientSecret
        - discoveryEndpoint
        - loginEnabled
        - prompt
        - authenticationContextClassReference
        - additionalScopes
        - emailVerifiedRequired
        - rpInitiatedLogoutEnabled
      properties:
        clientId:
          type: string
          description: The client ID issued when registering n8n with the OIDC provider.
          example: n8n-client
        clientSecret:
          type: string
          description: |
            The client secret issued when registering n8n with the OIDC provider. Redacted on read when set; never echoed back in plaintext.
          example: '**hidden**'
        discoveryEndpoint:
          type: string
          format: uri
          description: The OIDC provider's well-known discovery endpoint.
          example: https://accounts.google.com/.well-known/openid-configuration
        loginEnabled:
          type: boolean
          description: Whether OIDC single sign-on is enabled.
          example: false
        prompt:
          type: string
          enum:
            - none
            - login
            - consent
            - select_account
            - create
          description: The prompt parameter to use when authenticating with the OIDC provider.
          example: select_account
        authenticationContextClassReference:
          type: array
          items:
            type: string
          description: |
            ACR values to include in the authorization request (acr_values parameter), in order of preference.
          example:
            - mfa
            - pwd
        additionalScopes:
          type: string
          description: |
            Additional scopes to request, space separated. n8n always requests `openid`, `profile` and `email`.
          example: groups roles
        emailVerifiedRequired:
          type: boolean
          description: |
            Whether the identity provider must assert that the user's email address is verified before the login is accepted. When disabled, only an explicit negative assertion is rejected.
          example: false
        rpInitiatedLogoutEnabled:
          type: boolean
          description: |
            Whether signing out of n8n also ends the session at the OIDC provider via RP-Initiated Logout. When disabled, sign-out is local to n8n only.
          example: false
    oidc-configuration.update:
      type: object
      additionalProperties: false
      description: |
        Full OIDC SSO configuration to set. This is a full replacement: every writable field must be provided. Partial updates are rejected. Submit the redacted secret sentinel  for `clientSecret` to keep the stored secret unchanged.
      required:
        - clientId
        - clientSecret
        - discoveryEndpoint
        - loginEnabled
        - prompt
        - authenticationContextClassReference
        - additionalScopes
        - emailVerifiedRequired
        - rpInitiatedLogoutEnabled
      properties:
        clientId:
          type: string
          minLength: 1
          description: The client ID issued when registering n8n with the OIDC provider.
          example: n8n-client
        clientSecret:
          type: string
          minLength: 1
          description: |
            The client secret issued when registering n8n with the OIDC provider. Submit the redacted sentinel value returned on read to keep the stored secret unchanged.
          example: my-client-secret
        discoveryEndpoint:
          type: string
          format: uri
          description: The OIDC provider's well-known discovery endpoint.
          example: https://accounts.google.com/.well-known/openid-configuration
        loginEnabled:
          type: boolean
          description: Whether OIDC single sign-on is enabled.
          example: false
        prompt:
          type: string
          enum:
            - none
            - login
            - consent
            - select_account
            - create
          description: The prompt parameter to use when authenticating.
          example: select_account
        authenticationContextClassReference:
          type: array
          items:
            type: string
          description: |
            ACR values to include in the authorization request (acr_values parameter), in order of preference. Use an empty array when unused.
          example:
            - mfa
            - pwd
        additionalScopes:
          type: string
          description: |
            Additional scopes to request, space separated. n8n always requests `openid`, `profile` and `email`. Use an empty string when unused.
          example: groups roles
        emailVerifiedRequired:
          type: boolean
          description: |
            Whether the identity provider must assert that the user's email address is verified before the login is accepted. When disabled, only an explicit negative assertion is rejected.
          example: false
        rpInitiatedLogoutEnabled:
          type: boolean
          description: |
            Whether signing out of n8n also ends the session at the OIDC provider via RP-Initiated Logout. When disabled, sign-out is local to n8n only.
          example: false
    saml-configuration:
      type: object
      additionalProperties: false
      required:
        - entityID
        - returnUrl
        - mapping
        - metadata
        - metadataUrl
        - ignoreSSL
        - loginBinding
        - loginEnabled
        - loginLabel
        - authnRequestsSigned
        - wantAssertionsSigned
        - wantMessageSigned
        - signingPrivateKey
        - signingCertificate
        - acsBinding
        - signatureConfig
        - relayState
      properties:
        entityID:
          type: string
          readOnly: true
          description: Service provider entity ID (metadata URL).
          example: https://n8n.example.com/rest/sso/saml/metadata
        returnUrl:
          type: string
          readOnly: true
          description: Assertion Consumer Service (ACS) return URL.
          example: https://n8n.example.com/rest/sso/saml/acs
        mapping:
          type: object
          description: Mapping of SAML attributes to n8n user fields.
          additionalProperties: false
          required:
            - email
            - firstName
            - lastName
            - userPrincipalName
            - n8nInstanceRole
            - n8nProjectRoles
          properties:
            email:
              type: string
              description: SAML attribute mapped to the user's email.
            firstName:
              type: string
              description: SAML attribute mapped to the user's first name.
            lastName:
              type: string
              description: SAML attribute mapped to the user's last name.
            userPrincipalName:
              type: string
              description: SAML attribute mapped to the user's principal name.
            n8nInstanceRole:
              type: string
              description: SAML attribute mapped to the n8n instance role.
            n8nProjectRoles:
              type: array
              items:
                type: string
              description: SAML attributes mapped to n8n project roles, formatted as `<projectId>:<role>`.
        metadata:
          type: string
          description: |
            Identity provider metadata in XML format. Redacted on read when set because it contains IdP certificates; never echoed back in plaintext. Use an empty string when unset.
          example: '**hidden**'
        metadataUrl:
          type: string
          description: URL to fetch identity provider metadata from. Use an empty string when unset.
        ignoreSSL:
          type: boolean
          description: Whether to ignore SSL certificate errors when fetching metadata from a URL.
          example: false
        loginBinding:
          type: string
          enum:
            - redirect
            - post
          description: SAML login request binding.
          example: redirect
        loginEnabled:
          type: boolean
          description: Whether SAML login is enabled.
          example: false
        loginLabel:
          type: string
          description: Label shown on the SAML login button.
          example: SAML
        authnRequestsSigned:
          type: boolean
          description: Whether authentication requests are signed.
          example: false
        wantAssertionsSigned:
          type: boolean
          description: Whether signed assertions are required.
          example: true
        wantMessageSigned:
          type: boolean
          description: Whether signed SAML messages are required.
          example: true
        signingPrivateKey:
          type: string
          description: |
            PEM-encoded private key for signing SAML AuthnRequests. Redacted on read when set; never echoed back in plaintext. Use an empty string when unset.
          example: '**hidden**'
        signingCertificate:
          type: string
          description: |
            PEM-encoded certificate containing the public key matching the signing private key. Redacted on read when set; never echoed back in plaintext. Use an empty string when unset.
          example: '**hidden**'
        acsBinding:
          type: string
          enum:
            - redirect
            - post
          description: Assertion Consumer Service binding.
          example: post
        signatureConfig:
          type: object
          description: Configuration for the signature in SAML requests and responses.
          additionalProperties: false
          required:
            - prefix
            - location
          properties:
            prefix:
              type: string
              example: ds
            location:
              type: object
              additionalProperties: false
              required:
                - reference
                - action
              properties:
                reference:
                  type: string
                  example: /samlp:Response/saml:Issuer
                action:
                  type: string
                  enum:
                    - before
                    - after
                    - prepend
                    - append
                  example: after
        relayState:
          type: string
          description: Default relay state value for SAML requests. Use an empty string when unset.
          example: https://n8n.example.com
    saml-configuration.update:
      type: object
      additionalProperties: false
      description: |
        Full SAML SSO configuration. Every field must be provided; use empty strings or empty arrays when a value is unset. Partial updates are not supported.
      required:
        - mapping
        - metadata
        - metadataUrl
        - ignoreSSL
        - loginBinding
        - loginEnabled
        - loginLabel
        - authnRequestsSigned
        - wantAssertionsSigned
        - wantMessageSigned
        - signingPrivateKey
        - signingCertificate
        - acsBinding
        - signatureConfig
        - relayState
      properties:
        mapping:
          type: object
          description: Mapping of SAML attributes to n8n user fields. Use empty strings / empty arrays for unused attributes.
          additionalProperties: false
          required:
            - email
            - firstName
            - lastName
            - userPrincipalName
            - n8nInstanceRole
            - n8nProjectRoles
          properties:
            email:
              type: string
              description: SAML attribute mapped to the user's email.
            firstName:
              type: string
              description: SAML attribute mapped to the user's first name.
            lastName:
              type: string
              description: SAML attribute mapped to the user's last name.
            userPrincipalName:
              type: string
              description: SAML attribute mapped to the user's principal name.
            n8nInstanceRole:
              type: string
              description: SAML attribute mapped to the n8n instance role. Use an empty string when unused.
            n8nProjectRoles:
              type: array
              items:
                type: string
              description: |
                SAML attributes mapped to n8n project roles, formatted as `<projectId>:<role>`. Use an empty array when unused.
        metadata:
          type: string
          description: |
            Identity provider metadata in XML format. Use an empty string to clear stored metadata (also clears metadataUrl when no URL is provided). Use the redaction placeholder from a prior GET to leave an existing value unchanged.
        metadataUrl:
          type: string
          description: |
            URL to fetch identity provider metadata from. Use an empty string to clear a stored URL.
        ignoreSSL:
          type: boolean
          description: Whether to ignore SSL certificate errors when fetching metadata from a URL.
          example: false
        loginBinding:
          type: string
          enum:
            - redirect
            - post
          description: SAML login request binding.
          example: redirect
        loginEnabled:
          type: boolean
          description: Whether SAML login is enabled.
          example: false
        loginLabel:
          type: string
          description: Label shown on the SAML login button.
          example: SAML
        authnRequestsSigned:
          type: boolean
          description: Whether authentication requests are signed.
          example: false
        wantAssertionsSigned:
          type: boolean
          description: Whether signed assertions are required.
          example: true
        wantMessageSigned:
          type: boolean
          description: Whether signed SAML messages are required.
          example: true
        signingPrivateKey:
          type: string
          description: |
            PEM-encoded private key for signing SAML AuthnRequests. Use an empty string to clear an existing key, or the redaction placeholder from a prior GET to leave it unchanged.
        signingCertificate:
          type: string
          description: |
            PEM-encoded certificate containing the public key matching the signing private key. Use an empty string when unused or to clear an existing certificate.
        acsBinding:
          type: string
          enum:
            - redirect
            - post
          description: Assertion Consumer Service binding.
          example: post
        signatureConfig:
          type: object
          description: Configuration for the signature in SAML requests and responses.
          additionalProperties: false
          required:
            - prefix
            - location
          properties:
            prefix:
              type: string
              example: ds
            location:
              type: object
              additionalProperties: false
              required:
                - reference
                - action
              properties:
                reference:
                  type: string
                  example: /samlp:Response/saml:Issuer
                action:
                  type: string
                  enum:
                    - before
                    - after
                    - prepend
                    - append
                  example: after
        relayState:
          type: string
          description: Default relay state value for SAML requests. Use an empty string when unused.
          example: https://n8n.example.com
        entityID:
          type: string
          description: |
            Service provider entity ID. Returned by GET for convenience; ignored on write so a GET response can be sent back as a PUT body.
          example: https://n8n.example.com/rest/sso/saml/metadata
        returnUrl:
          type: string
          description: |
            Assertion Consumer Service return URL. Returned by GET for convenience; ignored on write so a GET response can be sent back as a PUT body.
          example: https://n8n.example.com/rest/sso/saml/acs
    create-credential-response:
      required:
        - id
        - name
        - type
        - isManaged
        - isGlobal
        - isResolvable
        - resolvableAllowFallback
        - createdAt
        - updatedAt
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: vHxaz5UaCghVYl9C
        name:
          type: string
          example: John's Github account
        type:
          type: string
          example: githubApi
        isManaged:
          type: boolean
          readOnly: true
          description: Whether the credential is managed by n8n (managed credentials cannot be edited via the API).
          example: false
        isGlobal:
          type: boolean
          readOnly: true
          description: Whether the credential is available for use by all users.
          example: false
        isResolvable:
          type: boolean
          readOnly: true
          description: Whether the credential can be dynamically resolved by a resolver.
          example: false
        resolvableAllowFallback:
          type: boolean
          readOnly: true
          description: Whether the credential resolver may fall back to static credentials if dynamic resolution fails.
          example: false
        resolverId:
          type: string
          nullable: true
          readOnly: true
          description: ID of the dynamic credential resolver associated with this credential, if any.
          example: null
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: 2022-04-29T11:02:29.842Z
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: 2022-04-29T11:02:29.842Z
    credentialSharedItem:
      type: object
      required:
        - id
        - name
        - role
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Project ID
        name:
          type: string
          description: Project name
        role:
          type: string
          description: Role of the credential in this project (e.g. credential:owner)
        createdAt:
          type: string
          format: date-time
          description: When the credential was shared with this project
        updatedAt:
          type: string
          format: date-time
          description: When the sharing was last updated
    credentialListItem:
      allOf:
        - $ref: '#/components/schemas/create-credential-response'
        - type: object
          required:
            - shared
          properties:
            shared:
              type: array
              description: Shared entries (project id, name, role, createdAt, updatedAt) from the credential's shared relation
              items:
                $ref: '#/components/schemas/credentialSharedItem'
    credentialList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/credentialListItem'
        nextCursor:
          type: string
          description: Paginate through credentials by setting the cursor parameter to a nextCursor attribute returned by a previous request. Default value fetches the first "page" of the collection.
          nullable: true
          example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
    credentialCreate:
      required:
        - name
        - type
        - data
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: R2DjclaysHbqn778
        name:
          type: string
          example: Joe's Github Credentials
        type:
          type: string
          example: githubApi
        data:
          type: object
          writeOnly: true
          example:
            accessToken: ada612vad6fa5df4adf5a5dsf4389adsf76da7s
        isResolvable:
          type: boolean
          example: false
          description: Whether this credential has resolvable fields
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: 2022-04-29T11:02:29.842Z
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: 2022-04-29T11:02:29.842Z
        projectId:
          type: string
          description: Project to create the credential in. Defaults to the user's personal project.
          example: VmwOO9HeTEj20kxM
    credential:
      required:
        - name
        - type
        - data
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: R2DjclaysHbqn778
        name:
          type: string
          example: Joe's Github Credentials
        type:
          type: string
          example: githubApi
        data:
          type: object
          writeOnly: true
          example:
            accessToken: ada612vad6fa5df4adf5a5dsf4389adsf76da7s
        isResolvable:
          type: boolean
          example: false
          description: Whether this credential has resolvable fields
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: 2022-04-29T11:02:29.842Z
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: 2022-04-29T11:02:29.842Z
    update-credential-request:
      type: object
      properties:
        name:
          type: string
          example: Updated Credential Name
          description: The name of the credential
        type:
          type: string
          example: githubApi
          description: The credential type. If changing type, data must also be provided.
        data:
          type: object
          writeOnly: true
          example:
            accessToken: new_token_value
          description: The credential data. Required when changing credential type.
        isGlobal:
          type: boolean
          example: false
          description: Whether this credential is available globally
        isResolvable:
          type: boolean
          example: false
          description: Whether this credential has resolvable fields
        isPartialData:
          type: boolean
          example: false
          default: false
          description: If true, unredacts and merges existing credential data with the provided data. If false, replaces the entire data object.
    credentialTestResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum:
            - OK
            - Error
        message:
          type: string
    execution:
      type: object
      properties:
        id:
          type: number
          example: 1000
        data:
          type: object
          additionalProperties: true
          description: |
            Detailed execution data. Only included when `includeData` is `true`.
          properties:
            redactionInfo:
              type: object
              nullable: true
              description: Present when execution data has been redacted.
              properties:
                isRedacted:
                  type: boolean
                  description: Whether the execution data was redacted.
                reason:
                  type: string
                  description: The reason for redaction.
                canReveal:
                  type: boolean
                  description: Whether the current user has permission to reveal the redacted data.
        finished:
          type: boolean
          example: true
        mode:
          type: string
          enum:
            - cli
            - error
            - integrated
            - internal
            - manual
            - retry
            - trigger
            - webhook
            - evaluation
            - chat
        retryOf:
          type: number
          nullable: true
        retrySuccessId:
          type: number
          nullable: true
          example: '2'
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
          nullable: true
          description: The time at which the execution stopped. Will only be null for executions that still have the status 'running'.
        workflowId:
          type: number
          example: '1000'
        waitTill:
          type: string
          nullable: true
          format: date-time
        customData:
          type: object
        status:
          type: string
          enum:
            - canceled
            - crashed
            - error
            - new
            - running
            - success
            - unknown
            - waiting
    executionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/execution'
        nextCursor:
          type: string
          description: Paginate through executions by setting the cursor parameter to a nextCursor attribute returned by a previous request. Default value fetches the first "page" of the collection.
          nullable: true
          example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
    tag:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
          example: 2tUt1wbLX592XDdX
        name:
          type: string
          example: Production
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    executionTags:
      type: array
      items:
        $ref: '#/components/schemas/tag'
    tagIds:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
        properties:
          id:
            type: string
            example: 2tUt1wbLX592XDdX
    node:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          example: 0f5532f9-36ba-4bef-86c7-30d607400b15
        name:
          type: string
          example: Jira
        webhookId:
          type: string
        disabled:
          type: boolean
        notesInFlow:
          type: boolean
        notes:
          type: string
        type:
          type: string
          example: n8n-nodes-base.jira
        typeVersion:
          type: number
          example: 1
        executeOnce:
          type: boolean
          example: false
        alwaysOutputData:
          type: boolean
          example: false
        retryOnFail:
          type: boolean
          example: false
        maxTries:
          type: number
        waitBetweenTries:
          type: number
        continueOnFail:
          type: boolean
          example: false
          description: use onError instead
          deprecated: true
        onError:
          type: string
          example: stopWorkflow
        position:
          type: array
          items:
            type: number
          example:
            - -100
            - 80
        parameters:
          type: object
          additionalProperties: true
          example:
            additionalProperties: {}
        credentials:
          type: object
          example:
            jiraSoftwareCloudApi:
              id: '35'
              name: jiraApi
        customTelemetryTags:
          type: object
          additionalProperties: false
          properties:
            tag:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - key
                  - value
                properties:
                  key:
                    type: string
                  value:
                    type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    workflowNodeGroup:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - nodeIds
      properties:
        id:
          type: string
          description: Unique identifier for the node group
          example: 9b1c8e2a-4d3f-4a6b-8c7d-1e2f3a4b5c6d
        name:
          type: string
          description: Display name of the node group
          example: Data processing
        description:
          type: string
          maxLength: 155
          description: Optional plain-text description of the node group
          example: Cleans and normalizes incoming records
        nodeIds:
          type: array
          description: IDs of the nodes that belong to this group
          items:
            type: string
    workflowSettings:
      type: object
      additionalProperties: false
      properties:
        saveExecutionProgress:
          type: boolean
        saveManualExecutions:
          type: boolean
        saveDataErrorExecution:
          type: string
          enum:
            - all
            - none
        saveDataSuccessExecution:
          type: string
          enum:
            - all
            - none
        executionTimeout:
          type: number
          example: 3600
          maxLength: 3600
        errorWorkflow:
          type: string
          example: VzqKEW0ShTXA5vPj
          description: The ID of the workflow that contains the error trigger node.
        timezone:
          type: string
          example: America/New_York
        executionOrder:
          type: string
          example: v1
        binaryMode:
          type: string
          enum:
            - separate
            - combined
          description: |
            Controls how binary data is resolved from a node's input. This is a derived,
            internal setting rather than something intended to be set programmatically.
            It is included in workflow responses for reference, but any value sent when
            creating or updating a workflow is ignored.
        callerPolicy:
          type: string
          enum:
            - any
            - none
            - workflowsFromAList
            - workflowsFromSameOwner
          description: |
            Controls which workflows are allowed to call this workflow using the Execute Workflow node.
            Defaults to workflowsFromSameOwner.

            Available options:
            - `any`: Any workflow can call this workflow (no restrictions)
            - `none`: No other workflows can call this workflow (completely blocked)
            - `workflowsFromSameOwner` (default): Only workflows owned by the same project can call this workflow
              * For personal projects: Only workflows created by the same user
              * For team projects: Only workflows within the same team project
            - `workflowsFromAList`: Only specific workflows listed in the `callerIds` field can call this workflow
              * Requires the `callerIds` field to specify which workflow IDs are allowed
              * See `callerIds` field documentation for usage
          example: workflowsFromSameOwner
        callerIds:
          type: string
          description: Comma-separated list of workflow IDs allowed to call this workflow (only used with workflowsFromAList policy)
          example: 14, 18, 23
        timeSavedMode:
          type: string
          enum:
            - fixed
            - dynamic
          description: |
            Controls how the time saved per execution is calculated.
            Available options:
            - `fixed`: Uses a predetermined time value specified in the `timeSavedPerExecution` field.
              * Requires the `timeSavedPerExecution` field to be set
              * Use when the time saved is consistent across all executions
            - `dynamic`: Automatically calculates time saved based on actual execution metrics
              * The `timeSavedPerExecution` field is ignored when this mode is active
              * Use when time saved varies between executions
        timeSavedPerExecution:
          type: number
          description: Estimated time saved per execution in minutes
        redactionPolicy:
          type: string
          enum:
            - none
            - non-manual
            - manual-only
            - all
          description: |
            Controls whether execution data is redacted for this workflow.

            Available options:
            - `none` (default): No redaction — all execution data is stored.
            - `non-manual`: Redact production (non-manually triggered) executions only.
            - `manual-only`: Redact manually triggered executions only.
            - `all`: Redact all executions (manual and production).

            When the instance has a redaction floor configured, the policy must be equal to
            or stricter than the floor. A policy weaker than the floor is rejected with 422
            on create, and on update when it changes the stored policy; an unchanged
            pre-existing below-floor policy is preserved (the floor is not applied
            retroactively). Omitting this field when creating a workflow seeds it to the
            instance floor instead.
          example: non-manual
        availableInMCP:
          type: boolean
          description: |
            Controls whether this workflow is accessible via the Model Context Protocol (MCP).
            Defaults to false.

            When enabled, this workflow can be called by MCP clients (AI assistants and other tools
            that support MCP). This allows external AI tools to discover and execute this workflow
            as part of their capabilities.

            Requirements for enabling MCP access:
            - The workflow must be active (not deactivated)
            - The workflow must contain at least one active Webhook node
            - Only webhook-triggered workflows can be exposed via MCP

            Security note: When a workflow is available in MCP, it can be discovered and executed
            by any MCP client that has the appropriate API credentials for your n8n instance.
          example: false
        customTelemetryTags:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - key
              - value
            properties:
              key:
                type: string
              value:
                type: string
        credentialResolverId:
          type: string
          description: |
            ID of the credential resolver used to resolve credentials for this workflow.
            This is a derived, internal setting managed via the workflow's credential
            resolver configuration rather than something intended to be set programmatically.
            It is included in workflow responses for reference, but any value sent when
            creating or updating a workflow is ignored.
    sharedWorkflow:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          example: workflow:owner
        workflowId:
          type: string
          example: 2tUt1wbLX592XDdX
        projectId:
          type: string
          example: 2tUt1wbLX592XDdX
        project:
          type: object
          properties:
            id:
              type: string
              readOnly: true
            name:
              type: string
            type:
              type: string
              readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    activeVersion:
      type: object
      readOnly: true
      nullable: true
      additionalProperties: false
      properties:
        versionId:
          type: string
          readOnly: true
          description: Unique identifier for this workflow version
          example: 7c6b9e3f-8d4a-4b2c-9f1e-6a5d3b8c7e4f
        workflowId:
          type: string
          readOnly: true
          description: The workflow this version belongs to
          example: 2tUt1wbLX592XDdX
        nodes:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/node'
        connections:
          type: object
          readOnly: true
          example:
            Jira:
              main:
                - - node: Jira
                    type: main
                    index: 0
        nodeGroups:
