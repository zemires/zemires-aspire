          description: The user's role in the project (e.g. project:admin, project:viewer).
          readOnly: true
          example: project:viewer
    projectMemberList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/projectMember'
        nextCursor:
          type: string
          description: Paginate through project members by setting the cursor parameter to the nextCursor attribute returned by a previous request. Default value fetches the first page of the collection.
          nullable: true
          example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
    communityPackage:
      type: object
      properties:
        packageName:
          type: string
          description: npm package name
        installedVersion:
          type: string
          description: Currently installed version
        authorName:
          type: string
          description: Package author name
        authorEmail:
          type: string
          description: Package author email
        installedNodes:
          type: array
          description: Nodes included in this package
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              latestVersion:
                type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updateAvailable:
          type: string
          description: Version available for update, if any
        failedLoading:
          type: boolean
          description: Whether the package failed to load
    communityPackageList:
      type: array
      items:
        $ref: '#/components/schemas/communityPackage'
    installCommunityPackageRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: npm package name (must start with n8n-nodes-)
        version:
          type: string
          description: Specific semver version to install
        verify:
          type: boolean
          description: |
            Whether to verify the package against the n8n-vetted package list. Required when the instance has N8N_UNVERIFIED_PACKAGES_ENABLED=false.
    insights:
      type: object
      required:
        - total
        - failed
        - failureRate
        - timeSaved
        - averageRunTime
      properties:
        total:
          type: object
          required:
            - value
            - deviation
            - unit
          properties:
            value:
              type: number
            deviation:
              type: number
              nullable: true
            unit:
              type: string
              enum:
                - count
        failed:
          type: object
          required:
            - value
            - deviation
            - unit
          properties:
            value:
              type: number
            deviation:
              type: number
              nullable: true
            unit:
              type: string
              enum:
                - count
        failureRate:
          type: object
          required:
            - value
            - deviation
            - unit
          properties:
            value:
              type: number
            deviation:
              type: number
              nullable: true
            unit:
              type: string
              enum:
                - ratio
        timeSaved:
          type: object
          required:
            - value
            - deviation
            - unit
          properties:
            value:
              type: number
            deviation:
              type: number
              nullable: true
            unit:
              type: string
              enum:
                - minute
        averageRunTime:
          type: object
          required:
            - value
            - deviation
            - unit
          properties:
            value:
              type: number
            deviation:
              type: number
              nullable: true
            unit:
              type: string
              enum:
                - millisecond
    folder:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          example: My Folder
        parentFolderId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    folder.create:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          example: My Folder
        parentFolderId:
          type: string
          example: abc123
    folder.update:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          example: Renamed Folder
        parentFolderId:
          type: string
          example: abc123
    exportPackageRequest:
      type: object
      additionalProperties: false
      description: Selects what to export. Provide `workflowIds` and/or `folderIds` to export loose workflows and folders, or `projectIds` to export whole projects, but not both groups in the same request. At least one id must be supplied.
      properties:
        workflowIds:
          type: array
          maxItems: 300
          description: IDs of the workflows to include in the exported package.
          items:
            type: string
            minLength: 1
          example:
            - 2tUt1wbLX592XDdX
        folderIds:
          type: array
          maxItems: 300
          description: IDs of the folders to include in the exported package. Each folder is exported with its nested folders.
          items:
            type: string
            minLength: 1
          example:
            - 9xKp2mNqRzAbCdEf
        projectIds:
          type: array
          description: IDs of the projects to include in the exported package.
          items:
            type: string
            minLength: 1
          example:
            - Ox8O54VQrmBrb4qL
        includeVariableValues:
          type: boolean
          default: true
          description: Whether values of variables referenced by the exported workflows are bundled into the package. When `false`, variables still travel as name/type files and are listed in the package requirements, but no values travel with the package.
        includeTags:
          type: boolean
          default: true
          description: Whether tags assigned to the exported workflows are bundled into the package. When `false`, no tag files, tag references, or tag requirements travel with the package.
        missingWorkflowDependencyPolicy:
          type: string
          enum:
            - fail
            - reference-only
            - include-in-package
          description: Policy for missing static sub-workflow dependencies. `fail` aborts the export when any static sub-workflow is missing from the package; `include-in-package` automatically adds missing static sub-workflows. `reference-only` keeps missing static sub-workflows out of the package and lists them in the package requirements as workflows expected to already exist on the target.
          example: fail
          default: fail
        workflowVersionPolicy:
          type: string
          enum:
            - published-strict
            - prefer-published
            - ignore-unpublished
            - latest
          description: Which version of each workflow travels in the package. `latest` exports the latest version, published or not. `published-strict` exports the published version and aborts the export if any workflow has none. `prefer-published` falls back to the latest version where there is no published one. `ignore-unpublished` leaves unpublished workflows out of the package entirely. The chosen version decides which credentials, data tables, variables and sub-workflows are bundled alongside it; the workflow's name, settings and tags are not versioned and always come from the latest version.
          example: latest
          default: latest
    importBlockingIssue:
      oneOf:
        - type: object
          description: |
            A workflow whose source id already matches one in the target project, under the `fail` conflict policy.
          required:
            - type
            - sourceWorkflowId
            - existingWorkflowId
            - name
          properties:
            type:
              type: string
              enum:
                - workflow-conflict
            sourceWorkflowId:
              type: string
            existingWorkflowId:
              type: string
            name:
              type: string
        - type: object
          description: |
            A `source`-policy workflow whose id is already taken on the instance. Workflow ids are globally unique, so the id cannot be created in the target project. The existing workflow may live in any project — including the target project itself — and may be archived (archived workflows keep their id but are never matched for updates).
          required:
            - type
            - sourceWorkflowId
            - existingWorkflowId
            - existingProjectId
            - isArchived
            - name
          properties:
            type:
              type: string
              enum:
                - workflow-id-conflict
            sourceWorkflowId:
              type: string
            existingWorkflowId:
              type: string
            existingProjectId:
              type: string
              nullable: true
              description: |
                Project that owns the existing workflow, or null when no owning project could be determined.
            isArchived:
              type: boolean
              description: Whether the existing workflow is archived.
            name:
              type: string
        - type: object
          description: |
            A workflow whose source id already matches one in the target project but lives outside the requested import folder. Folder-targeted imports cannot update workflows in place at a different location.
          required:
            - type
            - sourceWorkflowId
            - existingWorkflowId
            - existingParentFolderId
            - targetFolderId
            - name
          properties:
            type:
              type: string
              enum:
                - workflow-folder-conflict
            sourceWorkflowId:
              type: string
            existingWorkflowId:
              type: string
            existingParentFolderId:
              type: string
              nullable: true
              description: |
                Folder that currently contains the matched workflow, or null when it lives at the project root.
            targetFolderId:
              type: string
              description: Folder the import was requested to land in.
            name:
              type: string
        - type: object
          description: |
            A project defined by the package that already exists on this instance, under `projectConflictPolicy=fail`.
          required:
            - type
            - kind
            - sourceProjectId
            - name
          properties:
            type:
              type: string
              enum:
                - project-conflict
            kind:
              type: string
              enum:
                - fail-policy
            sourceProjectId:
              type: string
            name:
              type: string
              description: The project's name as it appears in the package.
        - type: object
          description: |
            A package folder that cannot be imported as-is. `kind` distinguishes the cause: `parent-mismatch` (a folder matched by id sits under a different parent than the package places it), `id-in-other-project` (the folder id already exists in a different project — ids are globally unique), or `fail-policy` (the folder already exists and `folderConflictPolicy` is `fail`).
          required:
            - type
            - kind
            - sourceFolderId
            - name
          properties:
            type:
              type: string
              enum:
                - folder-conflict
            kind:
              type: string
              enum:
                - parent-mismatch
                - id-in-other-project
                - fail-policy
            sourceFolderId:
              type: string
            name:
              type: string
            existingParentFolderId:
              type: string
              nullable: true
              description: "For `parent-mismatch`: the matched folder's current parent in the target."
            expectedParentFolderId:
              type: string
              nullable: true
              description: 'For `parent-mismatch`: the parent the package would place the folder under.'
            existingProjectId:
              type: string
              nullable: true
              description: 'For `id-in-other-project`: the project that already owns the id.'
        - type: object
          description: |
            A node type — or a version of a node type — used by a package workflow that this instance does not have, under `missingNodeTypeMode=fail`. One issue is reported per missing `(nodeType, typeVersion)` pair.
          required:
            - type
            - nodeType
            - typeVersion
            - usedByWorkflows
          properties:
            type:
              type: string
              enum:
                - missing-node-type
            nodeType:
              type: string
              description: Full node type name as used by the package's workflows.
            typeVersion:
              type: number
              description: Node type version the package's workflows use.
            usedByWorkflows:
              type: array
              items:
                type: string
              description: Package workflow ids that use this node type and version.
        - type: object
          description: A credential reference that could not be resolved in the target project.
          required:
            - type
            - kind
            - sourceId
            - usedByWorkflows
          properties:
            type:
              type: string
              enum:
                - credential-unresolved
            kind:
              type: string
              enum:
                - not_found
                - unknown_type
                - source_not_found
                - type_mismatch
            sourceId:
              type: string
            targetId:
              type: string
              description: Target credential id for an explicit credential binding.
            expectedType:
              type: string
              description: |
                For `type_mismatch`: the credential type the package's workflow node requires.
            actualType:
              type: string
              description: |
                For `type_mismatch`: the actual type of the resolved target credential.
            usedByWorkflows:
              type: array
              items:
                type: string
        - type: object
          description: |
            A tag referenced by the package's workflows that could not be resolved on the target instance. `kind` distinguishes the cause: `rename-drift` (the same-id target tag carries a different name — under `tagConflictPolicy=fail`, or `rename` when the package name is held by another tag), `name-collision` (the id is free but the name belongs to a different tag under `tagMissingMode=create` with `tagConflictPolicy=fail`; also raised when two package tags collide with each other, or when the target tag a reconcile would re-key is claimed by another package tag), `invalid-name` / `invalid-id` (the package tag's name or id cannot be written on this instance), or `permission-denied` (the importing user lacks the global `tag:create` / `tag:update` scope the plan needs).
          required:
            - type
            - kind
            - usedByWorkflows
          properties:
            type:
              type: string
              enum:
                - tag-unresolved
            kind:
              type: string
              enum:
                - rename-drift
                - name-collision
                - invalid-name
                - invalid-id
                - permission-denied
            sourceId:
              type: string
              description: Tag id as it appears in the package. Absent for `permission-denied`.
            name:
              type: string
              description: The (trimmed) package tag name. Absent for `permission-denied`.
            missingScope:
              type: string
              enum:
                - tag:create
                - tag:update
              description: 'For `permission-denied`: the global scope the importing user lacks.'
            existingTagId:
              type: string
              description: |
                Id of the contested target tag — the different tag currently holding the wanted name, or the target tag a blocked reconcile would re-key. Absent when two package tags collide with each other rather than over a target tag.
            existingName:
              type: string
              description: 'For `rename-drift`: the current name of the same-id target tag.'
            usedByWorkflows:
              type: array
              items:
                type: string
              description: |
                Package workflow ids (non-skipped) that reference the source tag — not workflows attached to the contested target tag.
        - type: object
          description: |
            A variable reference that could not be resolved in the target project or the global scope, under `variableMissingMode=must-preexist`.
          required:
            - type
            - name
            - usedByWorkflows
          properties:
            type:
              type: string
              enum:
                - variable-unresolved
            name:
              type: string
              description: Requirement name with no match in the target project or global scope.
            usedByWorkflows:
              type: array
              items:
                type: string
        - type: object
          description: |
            A variable that resolved in the target project or the global scope, but whose value differs from the one the package bundles for it, under `variableConflictPolicy=fail`. Also reported under `overwrite`, once per scope, when the projects of a package resolve one row and disagree about the value it should hold. Values are never reported — only the name and the scope the variable was found in.
          required:
            - type
            - name
            - usedByWorkflows
          properties:
            type:
              type: string
              enum:
                - variable-conflict
            name:
              type: string
              description: Name of the variable whose value differs.
            projectId:
              type: string
              description: |
                Project owning the resolved variable. Absent when it resolved at the global scope.
            usedByWorkflows:
              type: array
              items:
                type: string
        - type: object
          description: |
            Creating the package's variables under `create-stub` or `create-with-value` would exceed the instance variable quota (`quota:maxVariables`). Reported once for the whole import; nothing is created.
          required:
            - type
            - limit
            - remaining
            - requested
            - names
            - usedByWorkflows
          properties:
            type:
              type: string
              enum:
                - variable-limit-exceeded
            limit:
              type: integer
              description: The instance variable quota.
            remaining:
              type: integer
              description: Variable rows still available under the quota. The import is blocked because `requested` exceeds this, not because it exceeds `limit`.
            requested:
              type: integer
              description: Number of new variable rows the import would create (destination-deduplicated).
            names:
              type: array
              items:
                type: string
              description: The unique variable names the import would create.
            usedByWorkflows:
              type: array
              items:
                type: string
              description: Package workflow ids that reference any of the listed variables.
    event-types:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          description: Event names that can be streamed to a destination.
          items:
            type: string
          example:
            - n8n.workflow.started
            - n8n.workflow.success
            - n8n.workflow.failed
    destination.common:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Server-generated unique id of the destination. Returned in responses; not accepted in requests.
          example: 88be6560-bfb4-455c-8aa1-06971e9e5522
        label:
          type: string
          description: Human-readable name shown in the UI.
          example: My destination
        enabled:
          type: boolean
          description: Whether the destination currently receives events.
          example: true
        subscribedEvents:
          type: array
          items:
            type: string
          description: |
            Event names (or group prefixes, e.g. `n8n.workflow`, which matches all `n8n.workflow.*` events) this destination receives. Retrieve the full list of streamable event names from `GET /settings/log-streaming/event-types`.
          example:
            - n8n.workflow
            - n8n.audit
        anonymizeAuditMessages:
          type: boolean
          description: Whether audit message payloads are anonymized before being sent.
          example: false
        circuitBreaker:
          type: object
          additionalProperties: true
          description: |
            Circuit-breaker tuning for delivery. After repeated failures the destination stops sending for a cool-down window instead of hammering an unhealthy target. All fields are optional; sensible defaults apply when omitted.
          properties:
            maxFailures:
              type: integer
              description: Maximum failures within the sliding window before the breaker opens.
            failureWindow:
              type: integer
              description: Sliding window, in milliseconds, over which failures are counted.
    parameter-list:
      type: object
      additionalProperties: true
      description: Key-value pairs used when the matching `specify*` field is `keypair`.
      properties:
        parameters:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                example: Authorization
              value:
                description: |
                  Parameter value. Usually a string; numbers, booleans and null are also accepted.
                example: Bearer <token>
    destination.webhook:
      allOf:
        - $ref: '#/components/schemas/destination.common'
        - type: object
          additionalProperties: true
          required:
            - type
            - url
          properties:
            type:
              type: string
              enum:
                - webhook
              description: Sends each event as an HTTP request to a URL.
              example: webhook
            url:
              type: string
              format: uri
              description: Target URL that receives the event payload.
              example: https://example.com/n8n-events
            method:
              type: string
              description: HTTP method used for the request.
              example: POST
            sendHeaders:
              type: boolean
              description: Whether to attach custom headers to the request.
              example: false
            specifyHeaders:
              type: string
              description: How custom headers are provided — `keypair` or `json`.
              example: keypair
            headerParameters:
              $ref: '#/components/schemas/parameter-list'
            jsonHeaders:
              type: string
              description: Custom headers as a JSON string when `specifyHeaders` is `json`.
            sendQuery:
              type: boolean
              description: Whether to attach query parameters to the request.
              example: false
            specifyQuery:
              type: string
              description: How query parameters are provided — `keypair` or `json`.
            queryParameters:
              $ref: '#/components/schemas/parameter-list'
            jsonQuery:
              type: string
              description: Query parameters as a JSON string when `specifyQuery` is `json`.
            options:
              type: object
              additionalProperties: true
              description: Additional HTTP request options.
              properties:
                timeout:
                  type: integer
                  description: Request timeout in milliseconds.
                allowUnauthorizedCerts:
                  type: boolean
                  description: Accept self-signed or otherwise invalid TLS certificates.
                queryParameterArrays:
                  type: string
                  enum:
                    - indices
                    - brackets
                    - repeat
                  description: How array-valued query parameters are serialized into the query string.
                redirect:
                  type: object
                  additionalProperties: true
                  description: Redirect-following behaviour.
                  properties:
                    redirect:
                      type: object
                      additionalProperties: true
                      properties:
                        followRedirects:
                          type: boolean
                          description: Whether to follow HTTP redirects.
                        maxRedirects:
                          type: integer
                          description: Maximum number of redirects to follow.
                proxy:
                  type: object
                  additionalProperties: true
                  description: Outbound proxy configuration.
                  properties:
                    proxy:
                      type: object
                      additionalProperties: true
                      properties:
                        protocol:
                          type: string
                          enum:
                            - https
                            - http
                          description: Proxy protocol.
                        host:
                          type: string
                          description: Proxy host, without protocol or port.
                        port:
                          type: integer
                          description: Proxy port.
                socket:
                  type: object
                  additionalProperties: true
                  description: Connection socket options.
                  properties:
                    keepAlive:
                      type: boolean
                      description: Whether to keep sockets open for reuse.
                    maxSockets:
                      type: integer
                      description: Maximum sockets per host kept open at once.
                    maxFreeSockets:
                      type: integer
                      description: Maximum idle sockets per host kept open.
    destination.syslog:
      allOf:
        - $ref: '#/components/schemas/destination.common'
        - type: object
          additionalProperties: true
          required:
            - type
            - host
          properties:
            type:
              type: string
              enum:
                - syslog
              description: Sends each event to a syslog server.
              example: syslog
            host:
              type: string
              description: Syslog server host.
              example: syslog.example.com
            port:
              type: integer
              description: Syslog server port.
              example: 514
            protocol:
              type: string
              enum:
                - udp
                - tcp
                - tls
              description: Transport protocol.
              example: udp
            facility:
              type: integer
              minimum: 0
              maximum: 23
              description: |
                Syslog facility code (0–23, per RFC 5424). Common values: 0 Kernel, 1 User, 3 System, 13 Audit, 14 Alert, 16 Local0, 17 Local1, 18 Local2, 19 Local3, 20 Local4, 21 Local5, 22 Local6, 23 Local7.
              example: 16
            app_name:
              type: string
              description: Application name reported in the syslog message.
              example: n8n
            tlsCa:
              type: string
              description: PEM-encoded CA certificate used when `protocol` is `tls`.
    destination.sentry:
      allOf:
        - $ref: '#/components/schemas/destination.common'
        - type: object
          additionalProperties: true
          required:
            - type
            - dsn
          properties:
            type:
              type: string
              enum:
                - sentry
              description: Sends each event to a Sentry project.
              example: sentry
            dsn:
              type: string
              format: uri
              description: Sentry DSN the events are sent to.
              example: https://examplePublicKey@o0.ingest.sentry.io/0
    destination:
      type: object
      oneOf:
        - $ref: '#/components/schemas/destination.webhook'
        - $ref: '#/components/schemas/destination.syslog'
        - $ref: '#/components/schemas/destination.sentry'
      description: |
        A log streaming destination. The `type` field selects the variant and its type-specific fields: `webhook`, `syslog`, or `sentry`.
    destination.list:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          description: The configured log streaming destinations.
          items:
            $ref: '#/components/schemas/destination'
    test-result:
      type: object
      additionalProperties: false
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the test message was delivered to the destination successfully.
          example: true
    error:
      required:
        - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        description:
          type: string
    role:
      readOnly: true
      type: object
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        name:
          type: string
          example: owner
          readOnly: true
        scope:
          type: string
          readOnly: true
          example: global
        createdAt:
          type: string
          description: Time the role was created.
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          description: Last time the role was updated.
          format: date-time
          readOnly: true
    workflowList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/workflow'
        nextCursor:
          type: string
          description: Paginate through workflows by setting the cursor parameter to a nextCursor attribute returned by a previous request. Default value fetches the first "page" of the collection.
          nullable: true
          example: MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDA
    credentialType:
      type: object
      properties:
        displayName:
          type: string
          readOnly: true
          example: Email
        name:
          type: string
          readOnly: true
          example: email
        type:
          type: string
          readOnly: true
          example: string
        default:
          type: string
          readOnly: true
          example: string
    Error:
      $ref: '#/components/schemas/error'
    Role:
      $ref: '#/components/schemas/role'
    Execution:
      $ref: '#/components/schemas/execution'
    Node:
