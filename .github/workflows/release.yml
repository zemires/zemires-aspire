name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink / versioning

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # The package version comes from the tag (v13.6.0 -> 13.6.0, v13.6.0-preview.1 -> 13.6.0-preview.1).
      # Stable versions must match AspireMajorVersion.ToolkitMinorVersion.ToolkitPatchVersion from
      # Directory.Build.props (enforced by ReleaseBuild=true in Directory.Build.targets); prerelease
      # versions must at least share that VersionPrefix.
      - name: Determine version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix=$(dotnet msbuild src/Zemires.Aspire.Hosting.N8n/Zemires.Aspire.Hosting.N8n.csproj -getProperty:VersionPrefix)
          if [[ "${version%%-*}" != "$prefix" ]]; then
            echo "::error::Tag version '$version' does not match VersionPrefix '$prefix' from Directory.Build.props."
            exit 1
          fi
          if [[ "$version" == *-* ]]; then release_build=false; else release_build=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "msbuild-args=-p:Version=$version -p:ReleaseBuild=$release_build -p:AspireUseCliBundle=false" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      # AspireUseCliBundle=false: see ci.yml (ASPIRE009 on CI runners).
      - name: Restore
        run: dotnet restore Zemires.Aspire.slnx -p:AspireUseCliBundle=false

      - name: Build
        run: dotnet build Zemires.Aspire.slnx --configuration Release --no-restore ${{ steps.version.outputs.msbuild-args }}

      # Integration tests ([Trait("Category", "Integration")]) need Docker; they are excluded as in CI.
      - name: Test
        run: >
          dotnet test --solution Zemires.Aspire.slnx
          --configuration Release --no-build
          --filter-not-trait "Category=Integration"
          --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build --output ${{ github.workspace }}/nuget ${{ steps.version.outputs.msbuild-args }}
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: nuget/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.build.outputs.version }}
          path: nuget

      # Requires the repository secret NUGET_API_KEY (nuget.org API key with push rights for Zemires.*).
      - name: Push to nuget.org
        run: >
          dotnet nuget push "nuget/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
