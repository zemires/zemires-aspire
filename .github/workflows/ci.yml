name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink / versioning

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # AppHosts default to AspireUseCliBundle=true, whose automatic bundle setup fails on CI
      # runners with Aspire 13.6.1 (ASPIRE009). Use the DCP/dashboard NuGet packages instead;
      # the property must also be set on restore so those RID-specific packages are restored.
      - name: Restore
        run: dotnet restore Zemires.Aspire.slnx -p:AspireUseCliBundle=false

      - name: Build
        run: dotnet build Zemires.Aspire.slnx --configuration Release --no-restore -p:AspireUseCliBundle=false

      # Integration tests ([Trait("Category", "Integration")]) start containers via
      # DistributedApplicationTestingBuilder and need Docker; they are excluded here.
      - name: Test
        run: >
          dotnet test --solution Zemires.Aspire.slnx
          --configuration Release --no-build
          --filter-not-trait "Category=Integration"
          --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      # Verifies every src project is packable (e.g. README.md present).
      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build --output ${{ github.workspace }}/nuget
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nuget/*.nupkg
